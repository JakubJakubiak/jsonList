# Odpalasz ręcznie (Actions -> Approve pending -> Run workflow) po przejrzeniu PENDING.md
name: Approve pending
on:
  workflow_dispatch:
    inputs:
      approve:
        description: 'Co dodać do gry: "all" albo ID z PENDING.md oddzielone spacjami'
        required: false
        default: ''
      reject:
        description: 'Co odrzucić na stałe: ID oddzielone spacjami albo "rest" (wszystko poza zatwierdzonymi)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node approve.mjs
        env:
          APPROVE: ${{ inputs.approve }}
          REJECT: ${{ inputs.reject }}
      - run: node ingest.mjs   # odświeża PENDING.md po decyzjach (i dobiera kolejne propozycje)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        continue-on-error: true
      - run: |
          git config user.name "ingest-bot"
          git config user.email "ingest-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: approved entries $(date -u +%F)"
          git pull --rebase
          git push
