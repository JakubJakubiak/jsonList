# Zapisz jako: .github/workflows/check-links.yml
name: Check links
on:
  schedule:
    - cron: '0 4 1,15 * *'   # 1. i 15. dnia miesiąca ~ co 2 tygodnie
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes          # workflowy zapisujące do repo nie biegną naraz
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Refresh Suno (AI music)
        run: node refresh-suno.mjs
        continue-on-error: true   # awaria API Suno nie blokuje sprawdzania linków
      - run: node check-links.mjs
      - name: Commit report
        run: |
          git config user.name  "link-checker"
          git config user.email "link-checker@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: link report $(date -u +%F)"
          git pull --rebase
          git push
