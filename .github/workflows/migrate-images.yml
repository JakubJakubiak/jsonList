name: Migrate images
on:
  schedule:
    - cron: '17 * * * *'   # co godzinę, aż wszystkie obrazy z i.ibb.co będą w media/
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Stop when nothing is left
        id: left
        run: echo "count=$(grep -c 'i\.ibb\.co' humnOrAi.json || true)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.left.outputs.count != '0'
        with: { node-version: 22 }
      - if: steps.left.outputs.count != '0'
        run: npm install --no-save --no-package-lock sharp
      - if: steps.left.outputs.count != '0'
        run: node migrate-images.mjs
      - name: Commit
        if: steps.left.outputs.count != '0'
        run: |
          git config user.name  "image-migrator"
          git config user.email "image-migrator@users.noreply.github.com"
          git add media humnOrAi.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: move images to media/ ($(ls media | wc -l) files)"
          git pull --rebase
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
